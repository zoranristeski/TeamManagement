name: Azure App Service deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API and tests
        run: dotnet restore src/SportsTeamManagement.API.Tests/SportsTeamManagement.API.Tests.csproj

      - name: Build API
        run: dotnet build src/SportsTeamManagement.API/SportsTeamManagement.API.csproj --configuration Release --no-restore

      - name: Run API tests
        run: dotnet test src/SportsTeamManagement.API.Tests/SportsTeamManagement.API.Tests.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish src/SportsTeamManagement.API/SportsTeamManagement.API.csproj --configuration Release --no-restore --output "${{ runner.temp }}/api-publish"

      - name: Upload API package
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ${{ runner.temp }}/api-publish
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build-test-publish
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure-poc
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download API package
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ${{ runner.temp }}/api-publish

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ runner.temp }}/api-publish
